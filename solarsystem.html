<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gesture Controlled Solar System</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
        }

        /* Video element hidden but active for processing */
        .input_video {
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0; /* Hide webcam feed */
            pointer-events: none;
            z-index: -1;
        }

        /* UI Overlay */
        #ui-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Planet Name Label */
        #planet-label {
            text-align: center;
            font-size: 3rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 5px;
            text-shadow: 0 0 20px rgba(0, 150, 255, 0.8);
            margin-top: 20px;
            transition: opacity 0.3s;
        }

        /* Loading Screen */
        #loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.5rem;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px 40px;
            border-radius: 10px;
            border: 1px solid #444;
            pointer-events: none;
            z-index: 10;
        }

        /* Gesture Guide Panel */
        .guide-panel {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            max-width: 300px;
            align-self: flex-start;
        }

        .guide-item {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            font-size: 0.9rem;
        }

        .guide-icon {
            font-size: 1.5rem;
            margin-right: 15px;
            width: 30px;
            text-align: center;
        }

        .status-box {
            position: absolute;
            bottom: 20px;
            right: 20px;
            font-size: 0.8rem;
            color: #aaa;
        }

        .active-gesture {
            color: #4ade80; /* Green for active */
            font-weight: bold;
            text-shadow: 0 0 10px #4ade80;
        }
    </style>
</head>
<body>

    <video class="input_video"></video>

    <div id="loader">Initializing AI & 3D Engine...<br><span style="font-size:0.8em; color:#aaa">Please allow camera access</span></div>
    
    <div id="ui-container">
        <div id="planet-label">SOLAR SYSTEM</div>

        <div class="guide-panel">
            <h3 style="margin-top:0; border-bottom:1px solid #555; padding-bottom:10px;">Gesture Controls</h3>
            <div class="guide-item" id="g-palm">
                <span class="guide-icon">✋</span>
                <div>
                    <strong>Open Palm</strong><br>
                    Next Planet
                </div>
            </div>
            <div class="guide-item" id="g-fist">
                <span class="guide-icon">✊</span>
                <div>
                    <strong>Closed Fist</strong><br>
                    Zoom In (2x Speed)
                </div>
            </div>
            <div class="guide-item" id="g-peace">
                <span class="guide-icon">✌️</span>
                <div>
                    <strong>Peace Sign</strong><br>
                    Zoom Out (Normal Speed)
                </div>
            </div>
        </div>
        
        <div class="status-box">Powered by Three.js & MediaPipe</div>
    </div>

    <script>
        // ==========================================
        // 1. THREE.JS SETUP (THE WORLD)
        // ==========================================
        const scene = new THREE.Scene();
        // Fog for depth
        scene.fog = new THREE.FogExp2(0x000000, 0.002);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0x333333);
        scene.add(ambientLight);

        // Sun Light (Point light acting as the sun)
        const sunLight = new THREE.PointLight(0xffffff, 2, 300);
        scene.add(sunLight);

        // --- Objects ---

        // Stars
        const starGeometry = new THREE.BufferGeometry();
        const starMaterial = new THREE.PointsMaterial({color: 0xffffff, size: 0.5});
        const starVertices = [];
        for(let i=0; i<5000; i++) {
            const x = (Math.random() - 0.5) * 2000;
            const y = (Math.random() - 0.5) * 2000;
            const z = (Math.random() - 0.5) * 2000;
            starVertices.push(x, y, z);
        }
        starGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starVertices, 3));
        const stars = new THREE.Points(starGeometry, starMaterial);
        scene.add(stars);

        // The Sun
        const sunGeo = new THREE.SphereGeometry(10, 32, 32);
        const sunMat = new THREE.MeshBasicMaterial({ color: 0xffdd00 }); // Basic material ignores shadows, looks like light source
        const sun = new THREE.Mesh(sunGeo, sunMat);
        // Sun Glow (Fake glow using larger transparent mesh)
        const sunGlowGeo = new THREE.SphereGeometry(12, 32, 32);
        const sunGlowMat = new THREE.MeshBasicMaterial({ color: 0xffaa00, transparent: true, opacity: 0.3, side: THREE.BackSide });
        const sunGlow = new THREE.Mesh(sunGlowGeo, sunGlowMat);
        sun.add(sunGlow);
        scene.add(sun);

        // Planet Data
        const planetsData = [
            { name: "EARTH", color: 0x2233ff, size: 2, distance: 30, speed: 0.005 },
            { name: "MARS", color: 0xff4422, size: 1.5, distance: 45, speed: 0.004 },
            { name: "JUPITER", color: 0xcc9944, size: 6, distance: 70, speed: 0.002 },
            { name: "SATURN", color: 0xddcc88, size: 5, distance: 100, speed: 0.0015, hasRing: true }
        ];

        const planets = [];
        const orbitLines = [];

        planetsData.forEach(data => {
            // Planet Mesh
            const geo = new THREE.SphereGeometry(data.size, 32, 32);
            // Phong for shininess
            const mat = new THREE.MeshPhongMaterial({ 
                color: data.color, 
                shininess: 10
            }); 
            const mesh = new THREE.Mesh(geo, mat);
            
            // Orbit Ring (Visual only)
            const orbitCurve = new THREE.EllipseCurve(0, 0, data.distance, data.distance, 0, 2 * Math.PI, false, 0);
            const orbitPoints = orbitCurve.getPoints(100);
            const orbitGeo = new THREE.BufferGeometry().setFromPoints(orbitPoints);
            const orbitMat = new THREE.LineBasicMaterial({ color: 0x444444 });
            const orbitLine = new THREE.Line(orbitGeo, orbitMat);
            orbitLine.rotation.x = Math.PI / 2;
            scene.add(orbitLine);

            // Saturn Ring specific
            if(data.hasRing) {
                const ringGeo = new THREE.RingGeometry(data.size * 1.4, data.size * 2, 32);
                const ringMat = new THREE.MeshBasicMaterial({ color: 0xaa9977, side: THREE.DoubleSide, transparent: true, opacity: 0.8 });
                const ring = new THREE.Mesh(ringGeo, ringMat);
                ring.rotation.x = Math.PI / 2;
                mesh.add(ring);
            }

            // Object wrapper to handle orbit
            const pivot = new THREE.Object3D();
            pivot.add(mesh);
            mesh.position.set(data.distance, 0, 0); // Start position
            scene.add(pivot);

            planets.push({
                mesh: mesh,
                pivot: pivot,
                data: data,
                angle: Math.random() * Math.PI * 2 // Random start angle
            });
        });

        // ==========================================
        // 2. STATE MANAGEMENT & ANIMATION LOOP
        // ==========================================
        
        let currentPlanetIndex = 0; // 0 = Earth
        let isZoomed = false;
        let speedMultiplier = 1;
        let gestureCooldown = false; // Prevent rapid toggling

        // Camera Offset configs
        const offsets = {
            normal: { x: 0, y: 10, z: 20 },
            zoomed: { x: 0, y: 2, z: 8 }
        };

        function animate() {
            requestAnimationFrame(animate);

            // 1. Rotate Planets
            planets.forEach(p => {
                // Orbit
                p.angle += p.data.speed * speedMultiplier;
                p.mesh.position.x = Math.cos(p.angle) * p.data.distance;
                p.mesh.position.z = Math.sin(p.angle) * p.data.distance;
                
                // Self Rotation
                p.mesh.rotation.y += 0.01 * speedMultiplier;
            });

            // 2. Camera Controls
            const targetPlanet = planets[currentPlanetIndex];
            const targetVec = new THREE.Vector3();
            targetPlanet.mesh.getWorldPosition(targetVec);

            // Determine desired camera position based on state
            const offset = isZoomed ? offsets.zoomed : offsets.normal;
            
            // Calculate position relative to planet
            // We want the camera to follow the planet but stay 'behind' or 'above' it slightly
            // Simple approach: Add offset to planet position
            const desiredCamPos = new THREE.Vector3(
                targetVec.x + offset.x,
                targetVec.y + offset.y,
                targetVec.z + offset.z
            );

            // Smooth transition (Linear Interpolation)
            camera.position.lerp(desiredCamPos, 0.05);
            camera.lookAt(targetVec);

            // 3. UI Updates
            document.getElementById('planet-label').innerText = targetPlanet.data.name;

            renderer.render(scene, camera);
        }

        animate();

        // Window Resize Handle
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });


        // ==========================================
        // 3. GESTURE RECOGNITION (THE BRAIN)
        // ==========================================

        const videoElement = document.getElementsByClassName('input_video')[0];
        const uiPalm = document.getElementById('g-palm');
        const uiFist = document.getElementById('g-fist');
        const uiPeace = document.getElementById('g-peace');

        function onResults(results) {
            // Hide Loader once we have results
            document.getElementById('loader').style.display = 'none';

            // Reset UI Highlights
            uiPalm.classList.remove('active-gesture');
            uiFist.classList.remove('active-gesture');
            uiPeace.classList.remove('active-gesture');

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                
                // --- Logic to determine finger states ---
                // Fingertip indices: 4(Thumb), 8(Index), 12(Middle), 16(Ring), 20(Pinky)
                // PIP/MCP indices (knuckles) to compare against
                
                const isFingerUp = (tipIdx, pipIdx) => {
                    // Y increases downwards in MediaPipe coords
                    return landmarks[tipIdx].y < landmarks[pipIdx].y;
                };

                // Thumb is tricky (moves sideways), check X distance relative to wrist
                // Assuming right hand. If Left hand, logic flips. 
                // Simple distance check: is tip further from palm center than IP joint?
                // Let's stick to Y for 4 fingers and simple check for thumb
                
                const indexUp = isFingerUp(8, 6);
                const middleUp = isFingerUp(12, 10);
                const ringUp = isFingerUp(16, 14);
                const pinkyUp = isFingerUp(20, 18);
                const thumbUp = landmarks[4].y < landmarks[3].y; // Simple height check

                let fingersUpCount = 0;
                if(indexUp) fingersUpCount++;
                if(middleUp) fingersUpCount++;
                if(ringUp) fingersUpCount++;
                if(pinkyUp) fingersUpCount++;
                if(thumbUp) fingersUpCount++;

                // --- GESTURE MAPPING ---

                // 1. OPEN PALM (All 5 fingers up)
                if (fingersUpCount >= 4) { 
                    uiPalm.classList.add('active-gesture');
                    
                    if (!gestureCooldown) {
                        // Action: Next Planet
                        currentPlanetIndex = (currentPlanetIndex + 1) % planets.length;
                        
                        // Start Cooldown
                        gestureCooldown = true;
                        setTimeout(() => { gestureCooldown = false; }, 1000); // 1 second wait
                    }
                }

                // 2. CLOSED FIST (0 or 1 finger up - allowing for imperfect thumb)
                else if (fingersUpCount <= 1) {
                    uiFist.classList.add('active-gesture');
                    // Action: Zoom In + Fast
                    isZoomed = true;
                    speedMultiplier = 2.0;
                }

                // 3. PEACE SIGN (Index & Middle Up, others down)
                else if (indexUp && middleUp && !ringUp && !pinkyUp) {
                    uiPeace.classList.add('active-gesture');
                    // Action: Zoom Out + Normal Speed
                    isZoomed = false;
                    speedMultiplier = 1.0;
                }
            }
        }

        // ==========================================
        // 4. MEDIAPIPE INITIALIZATION
        // ==========================================
        const hands = new Hands({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        }});

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.7,
            minTrackingConfidence: 0.7
        });

        hands.onResults(onResults);

        const cameraFeed = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({image: videoElement});
            },
            width: 640,
            height: 480
        });

        cameraFeed.start();

    </script>
</body>
</html>
